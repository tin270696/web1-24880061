<!doctype html>
<html lang="en">
    <head>
        <title>24880061 - Web1 Project</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Fontawesome -->
        <script src="https://kit.fontawesome.com/504502cb2e.js" crossorigin="anonymous"></script>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />

        <!-- CSS -->
        <link rel="stylesheet" href="css/24880061.css">
    </head>

    <body>
        <!-- Navigation -->
        <header class="container">
            <nav class="navbar navbar-expand-sm navbar-light">
                <div class="container">
                    <a class="navbar-brand" href="./index.html">
                        <img src="images/logo.png" alt="Logo">
                    </a>
                    <button
                        class="navbar-toggler d-lg-none"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#header-menu"
                        aria-controls="header-menu"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="header-menu">
                        <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="./index.html" aria-current="page">
                                    Home
                                    <span class="visually-hidden">(current)</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="./about.html">About</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./gallery.html">Gallery</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./blogs.html">Blogs</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./contacts.html">Contacts</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link linkLogin" href="#" style="display: block" data-bs-toggle="modal" data-bs-target="#modal-login">Login</a>
                                <a class="nav-link linkLogout" href="#" style="display: none" onclick="logout()">Logout</a>
                            </li>
                            
                        </ul>
                        <form class="d-flex my-2 my-lg-0 border rounded-pill" id="formSearch">
                            <input class="form-control ms-3 border-0" type="text" placeholder="Search"/>
                            <button class="btn my-2 my-sm-0 border-0" type="submit">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </nav>
        </header>

        <section id="banner-small"></section>

        <div id="content">
            <!-- About-us -->
            <section class="container py-5">
                <div class="row">
                    <div class="col-md-8 col-sm-12" id="about-us">
                    </div>
                    <div class="col-md-4 col-sm-12" id="visions">
                    </div>
                </div>
            </section>

            <!-- Testimonials -->
            <section class="container-fluid" id="testimonials">
            </section>

            <!-- Our-team -->
            <section class="container py-5" id="our-team">
            </section>    
        </div>
        
        <!-- Footer -->
        <footer class="container-fluid text-center py-3">
            <ul class="nav justify-content-center py-3" id="menu-footer">
                <li class="nav-item">
                    <a class="nav-link" href="./index.html" aria-current="page">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="./about.html">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./gallery.html">Gallery</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./blogs.html">Blogs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./contacts.html">Contacts</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link linkLogin" href="#" style="display: block" data-bs-toggle="modal" data-bs-target="#modal-login">Login</a>
                    <a class="nav-link linkLogout" href="#" style="display: none" onclick="logout()">Logout</a>
                </li>
            </ul>
            <p class="text-white-50">Copyright &copy; 2025 by Luu Trung Tin - 24880061</p>
        </footer>

        <!-- Form login modal -->
        <div class="modal fade" id="modal-login" tabindex="-1" role="dialog" aria-labelledby="modalTitleId"  aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="#" method="post" id="formLogin" onsubmit="login(event)">
                            <h3 class="text-center">Login Form</h3>
                            <div class="mb-3">
                                <input type="text" name="username" id="username" placeholder="Username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" name="password" id="password" placeholder="Password" class="form-control" required>
                            </div>
                            <button type="submit" class="form-control">Login</button>
                        </form>
                    </div>
                    <div class="modal-footer justify-content-center">
                        <div class="text-danger" id="errorMessage"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>

        <script src="./js/24880061.js"></script>

        <!-- HandlebarsJS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js" integrity="sha512-E1dSFxg+wsfJ4HKjutk/WaCzK7S2wv1POn1RRPGh8ZK+ag9l244Vqxji3r6wgz9YBf6+vhQEYJZpSjqWFPg9gg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <script id="about-us-template" type="text/x-handlebars-template">
            {{#each data}}
            <h1 class="py-3">{{name}}</h1>
            <div>
                <img src="{{thumbpath}}" alt="{{name}}" class="float-start rounded-4 me-3">
                <div class="text-black-50">{{{summary}}}</div>
                <a href="#" class="btn btn-link ps-0 readmore"
                onclick="loadData('aboutus/{{id}}', 'details-template', 'content')">Read more</a>
            </div>
            {{/each}}
        </script>

        <script id="visions-template" type="text/x-handlebars-template">
            <h1 class="py-3">Our Vision</h1>
            {{#each data}}
            <div class="mb-3 clearfix">
                <a href="#" onclick="loadData('visions/{{id}}', 'details-template', 'content')" class="text-decoration-none">
                    <img src="{{thumbpath}}" alt="{{name}}" class="float-start rounded-4 me-3">
                    <h3 class="text-black">{{name}}</h3>
                    <p class="text-black-50">{{summary}}</p>
                </a>
            </div>
            {{/each}}
        </script>

        <script id="testimonials-template" type="text/x-handlebars-template">
            <div class="container py-5">
                <h1 class="text-white mb-4">Testimonials</h1>
                <div class="row mb-3">
                    {{#each data}}
                    <div class="col">
                        <p class="text-black-50">{{summary}}</p>
                        <span class="text-white">{{name}}</span><br>
                        <a href="#">{{email}}</a>
                    </div>
                    {{/each}}
                </div>
            </div>
        </script>

        <script id="our-team-template" type="text/x-handlebars-template">
            <h1>Our Team</h1>
            <div class="row py-3">
                {{#each data}}
                <div class="col">
                    <a href="#" class="text-decoration-none" onclick="loadData('team/{{id}}', 'details-template', 'content')">
                        <img src="{{thumbpath}}" alt="{{name}}" class="rounded-4 mb-3 img-fluid">
                        <h4 class="text-black">{{name}}</h4>
                        <p class="text-black-50">{{summary}}</p>
                    </a>
                </div>
                {{/each}}
            </div>
        </script>

        <script id="details-template" type="text/x-handlebars-template">
            <section class="container py-5 overflow-auto">
                {{#each data}}
                <h1 class="py-3">{{name}}</h1>
                <img src="{{imagepath}}" alt="{{name}}" class="float-start rounded-4 me-3">
                <div class="text-black-50">{{{description}}}</div>
                {{/each}}
            </section>
        </script>

        <script>
            checkLogin();
            loadData("aboutus", "about-us-template", "about-us");
            loadData("visions", "visions-template", "visions");
            loadData("testimonials", "testimonials-template", "testimonials");
            loadData("team", "our-team-template", "our-team");
        </script>
    </body>
</html>
