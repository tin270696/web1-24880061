        <!-- Form login modal -->

                                <input type="text" name="username" id="username" placeholder="Username" class="form-control" required>

                            <div class="mb-3">

                            </div>
                            <button type="submit" class="form-control">Login</button>
                        </form>
                    </div>
                    <div class="modal-footer justify-content-center">

                    </div>
                </div>
            </div>

        <!-- Bootstrap JavaScript Libraries -->

        <!-- HandlebarsJS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.runtime.min.js" integrity="sha512-WUaZk9J3oknQdKPT2wAfA0gEBG2371l1ACjiynLA/X28p07n1u59VFk7q1i83/bo7N9rqVdYKlnvwAAiwL36jQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <script src="./js/gallery.templates.min.js"></script>
        <script src="./js/24880061.min.js"></script>

        <script>
            const showDisabled = (linkId) => {
                const links = document.querySelectorAll('#gallery-category .nav-link');
                links.forEach(item => {
                    item.classList.remove('disabled');
                })
                document.getElementById(linkId).classList.toggle('disabled');
            }

            (async function() {
                checkLogin();
                await loadData("gallery-categories", "gallery-categories-template", "gallery-category");

                const searchParams = new URLSearchParams(location.search);
                let request = searchParams.get('request');
                if(request) {
                    await loadData(`${request}`, 'gallery-template', 'gallery-content');
                    showDisabled(request.replaceAll("/", "_"));
                }
                else {
                    await loadData('gallery', 'gallery-template', 'gallery-content');
                    showDisabled("gallery");
                }
            })();
        </script>
