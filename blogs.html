<!doctype html>

    <head>
        <title>24880061 - Web1 Project</title>

        <!-- Fontawesome -->

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"

            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />

        <!-- CSS -->
        <link rel="stylesheet" href="css/24880061.css">
    </head>

    <body>
        <!-- Navigation -->
        <header class="container">
            <nav class="navbar navbar-expand-sm navbar-light">
                <div class="container">
                    <a class="navbar-brand" href="./index.html">
                        <img src="images/logo.png" alt="Logo">
                    </a>
                    <button
                        class="navbar-toggler d-lg-none"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#header-menu"
                        aria-controls="header-menu"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="header-menu">
                        <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="./index.html" aria-current="page">
                                    Home
                                    <span class="visually-hidden">(current)</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./about.html">About</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./gallery.html">Gallery</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="./blogs.html">Blogs</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./contacts.html">Contacts</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link linkLogin" href="#" style="display: block" data-bs-toggle="modal" data-bs-target="#modal-login">Login</a>
                                <a class="nav-link linkLogout" href="#" style="display: none" onclick="logout()">Logout</a>
                            </li>
                            
                        </ul>
                        <form class="d-flex my-2 my-lg-0 border rounded-pill" id="formSearch">
                            <input class="form-control ms-3 border-0" type="text" placeholder="Search"/>
                            <button class="btn my-2 my-sm-0 border-0" type="submit">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </nav>
        </header>

        <section id="banner-small"></section>

        <section class="container py-5">
            <div class="row">
                <div class="col-8" id="blogs">
                </div>
                <div class="col-4" id="blogs-categories">
                </div>
            </div>
        </section>
        
        <!-- Footer -->
        <footer class="container-fluid text-center py-3">
            <ul class="nav justify-content-center py-3" id="menu-footer">
                <li class="nav-item">
                    <a class="nav-link" href="./index.html" aria-current="page">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./about.html">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./gallery.html">Gallery</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="./blogs.html">Blogs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./contacts.html">Contacts</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link linkLogin" href="#" style="display: block" data-bs-toggle="modal" data-bs-target="#modal-login">Login</a>
                    <a class="nav-link linkLogout" href="#" style="display: none" onclick="logout()">Logout</a>
                </li>
            </ul>
            <p class="text-white-50">Copyright &copy; 2025 by Luu Trung Tin - 24880061</p>
        </footer>

        <!-- Form login modal -->
        <div class="modal fade" id="modal-login" tabindex="-1" role="dialog" aria-labelledby="modalTitleId"  aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="#" method="post" id="formLogin" onsubmit="login(event)">
                            <h3 class="text-center">Login Form</h3>
                            <div class="mb-3">
                                <input type="text" name="username" id="username" placeholder="Username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" name="password" id="password" placeholder="Password" class="form-control" required>
                            </div>
                            <button type="submit" class="form-control">Login</button>
                        </form>
                    </div>
                    <div class="modal-footer justify-content-center">
                        <div class="text-danger" id="errorMessage"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>

        <!-- HandlebarsJS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js" integrity="sha512-E1dSFxg+wsfJ4HKjutk/WaCzK7S2wv1POn1RRPGh8ZK+ag9l244Vqxji3r6wgz9YBf6+vhQEYJZpSjqWFPg9gg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <script src="./js/handlebars-pagination-helper.js"></script>
        <script src="./js/24880061.js"></script>

        <script id="blogs-categories-template" type="text/x-handlebars-template">
            <h1>Categories</h1>
            <ul class="py-3">
                {{#each data}}
                <li>
                    <a href="#" class="text-black-50 text-decoration-none"
                    onclick="loadBlogs('blogs/categories/{{id}}')">{{name}}</a>
                </li>
                {{/each}}
            </ul>
        </script>

        <script id="blogs-template" type="text/x-handlebars-template">
            <h1>Blogs</h1>
            {{#each data}}
            <div class="clearfix py-3">
                <h3>{{name}}</h3>
                <p class="text-black-50">by {{author}} in <a href="#" onclick="loadBlogs('blogs/categories/{{category.id}}')">{{category.name}}</a> on {{formatDate date}} <a href="#" onclick="loadBlogDetails('{{id}}', true)">Comments ({{comments.length}})</a></p>
                <img src="{{thumbpath}}" alt="{{name}}" class="float-start me-3 border rounded-4">
                <p class="text-black-50">{{summary}}</p>
                <a href="#" class="btn btn-link readmore ps-0" onclick="loadBlogDetails('{{id}}')">Read more</a>
            </div>
            {{/each}}
            {{#pagination currentPage pageCount}}
            <nav aria-label="Page navigation">
                <ul class="pagination">
                    {{#each pages}}
                        {{#if isCurrent}}
                        <li class="page-item disabled" aria-current="page"><a class="page-link" href="#" onclick="loadBlogs('{{../../request}}', {{page}})">{{page}}</a></li>
                        {{/if}}
                        {{#unless isCurrent}}
                        <li class="page-item"><a class="page-link" href="#" onclick="loadBlogs('{{../../request}}', {{page}})">{{page}}</a></li>
                        {{/unless}}
                    {{/each}}
                </ul>
            </nav>
            {{/pagination}}
        </script>

        <script id="details-template" type="text/x-handlebars-template">
            {{#each data}}
            <h3>{{name}}</h3>
            <p class="text-black-50">by {{author}} in <a href="#" onclick="loadBlogs('blogs/categories/{{category.id}}')">{{category.name}}</a> on {{formatDate date}} <a href="#comments">Comments ({{comments.length}})</a></p>
            <img src="{{imagepath}}" alt="{{name}}" class="float-start me-3 rounded-3">
            <div class="text-black-50">{{{description}}}</div>
            <div class="py-3">
                <h3>Leave your comments</h3>
                <form action="#" method="post" class="text-black-50">
                    <div class="row">
                        <div class="col-4">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name (Required)</label>
                                <input type="text" class="form-control form-control-sm" name="name" id="name" placeholder="" required/>
                            </div>
                        </div>
                        <div class="col">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="text" class="form-control form-control-sm" name="email" id="email" placeholder=""  pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required/>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" name="message" id="message" rows="3" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="1" id="agree" required/>
                                <label class="form-check-label" for="agree">Agree to terms and conditions.</label>
                            </div>
                        </div>
                        <div class="col text-end">
                            <button type="submit" class="btn btn-link text-decoration-none p-0">
                                Submit Comment
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <a id="comments"></a>
            <div class="bg-dark text-white-50 p-2">COMMENTS ({{comments.length}})</div>
            <div class="py-3 text-black-50">
                {{#each comments}}
                <p>{{name}} &nbsp;&nbsp; {{formatDate date}}</p>
                <p>{{summary}}</p>
                <hr>
                {{/each}}
            </div>
            {{/each}}
        </script>

        <script>
            checkLogin();
            Handlebars.registerHelper('formatDate', (date) => {
                let formatDate = new Date(date);
                let options = {
                    weekday: 'short',
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric',
                    timeZoneName: 'short'
                };
                return formatDate.toLocaleString('en-US', options);
            })

            const loadBlogs = async (req, currentPage = 1) => {
                const response = await fetch(`${API}/${req}?page=${currentPage}`);
                const context = await response.json();
                context.currentPage = currentPage;
                context.request = req;

                var source = document.getElementById('blogs-template').innerHTML;
                var template = Handlebars.compile(source);

                var view = document.getElementById('blogs');
                view.innerHTML = template(context);
            }

            loadBlogs('blogs');
            loadData('blogs-categories', 'blogs-categories-template', 'blogs-categories');

            const loadBlogDetails = async (blogId, goToComment = false) => {
                await loadData(`blogs/${blogId}`, 'details-template', 'blogs');
                if(goToComment) {
                    window.location.href = '#comments';
                }
            }
        </script>
    </body>
</html>
